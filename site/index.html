<style>
:root{
  --ground:#EAE5DB; --leaf:#F7F4EE; --ink:#2A231C; --ink2:#62584B; --ink3:#8D8374; --rule:#D8CFC0;
  --lapis:#233A7C; --lapis2:#2D4893; --cloth:#EFE6D2; --verm:#AE3328; --gold:#B38B3D; --gold-hi:#EBCB7E; --gold-lo:#8A6620;
  --shadow:rgba(42,35,28,.20); --bar:rgba(234,229,219,.86); --dim:rgba(20,16,12,.52);
  --rb:#2E6B4F; --rb2:#2E6B4F;
  --serif:"Gowun Batang","Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --barh:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#11162C; --leaf:#181E38; --ink:#EAE3D3; --ink2:#ABA290; --ink3:#7E7767; --rule:#2B3254;
  --lapis:#1B2A5E; --lapis2:#24387D; --cloth:#EFE6D2; --verm:#E26C5F; --gold:#D3B067; --gold-hi:#F0D693; --gold-lo:#9C7A34;
  --shadow:rgba(0,0,0,.5); --bar:rgba(17,22,44,.86); --dim:rgba(4,6,14,.66); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#11162C; --leaf:#181E38; --ink:#EAE3D3; --ink2:#ABA290; --ink3:#7E7767; --rule:#2B3254;
  --lapis:#1B2A5E; --lapis2:#24387D; --cloth:#EFE6D2; --verm:#E26C5F; --gold:#D3B067; --gold-hi:#F0D693; --gold-lo:#9C7A34;
  --shadow:rgba(0,0,0,.5); --bar:rgba(17,22,44,.86); --dim:rgba(4,6,14,.66); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.7 var(--sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--ground)}
body.on-cover::before{background:var(--lapis)}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--verm);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 위 막대 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--barh);background:var(--bar);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule);transition:background-color .4s,border-color .4s,color .4s}
.bar .wrap{height:100%;display:flex;align-items:center;gap:14px}
.brand{font:700 16px/1 var(--serif);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{font:500 12.5px var(--sans);color:var(--ink2);margin-left:8px}
.nav{display:none;gap:4px;margin-left:auto}
.nav a{font:500 14px var(--sans);text-decoration:none;padding:7px 12px;border-radius:999px;color:var(--ink2)}
.nav a[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.kid{margin-left:auto;flex:0 0 auto;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 12px;font:500 13px var(--sans);cursor:pointer;color:var(--ink2)}
.kid[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22180A}
body.on-cover .bar{background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--cloth)}
body.on-cover .brand{opacity:0;pointer-events:none}
body.on-cover .nav a{color:rgba(239,230,210,.8)}
body.on-cover .nav a[aria-current="page"]{color:var(--cloth);background:rgba(255,255,255,.1)}
body.on-cover .kid{border-color:rgba(239,230,210,.35);color:var(--cloth)}
@media (min-width:761px){.nav{display:flex}.kid{margin-left:6px}.cover{min-height:min(calc(100svh - 24px),820px)}}

/* 아래 탭(휴대폰) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--leaf);border-top:1px solid var(--rule);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs a{display:grid;justify-items:center;gap:2px;text-decoration:none;font:500 11.5px var(--sans);color:var(--ink3);padding:4px 0}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke:var(--verm)}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.tabs{display:none}main{padding-bottom:64px}}

/* 표지 */
.cover{position:relative;margin-top:calc(-1 * var(--barh));padding-top:var(--barh);min-height:min(calc(100svh - 62px - env(safe-area-inset-bottom,0px)),820px);display:grid;place-items:center;
  background:var(--lapis);color:var(--cloth);isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;mix-blend-mode:soft-light;
  background-image:radial-gradient(ellipse 80% 70% at 50% 42%,rgba(255,255,255,.16),transparent 70%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.cover::after{content:"";position:absolute;inset:16px;border:1.5px solid rgba(235,203,126,.26);border-radius:3px;box-shadow:inset 0 0 0 6px transparent,inset 0 0 0 7.5px rgba(235,203,126,.14);pointer-events:none}
.cv-in{position:relative;text-align:center;padding:56px 46px 96px;max-width:640px}
.cv-title{margin:0;font-family:var(--serif);font-weight:700;line-height:1.12;
  background:linear-gradient(172deg,var(--gold-hi) 8%,#F6E2A8 30%,var(--gold) 52%,var(--gold-lo) 64%,var(--gold-hi) 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.cv-title .l1{display:block;font-size:clamp(22px,5.4vw,30px);font-weight:400;margin-bottom:.35em}
.cv-title .l2{display:block;font-size:clamp(48px,13.5vw,96px)}
.cv-orn{width:min(260px,64%);margin:26px auto 22px;color:var(--gold)}
.cv-sub{margin:0 auto;max-width:24em;font:15.5px/1.75 var(--sans);color:rgba(239,230,210,.84)}
.cv-open{display:inline-block;margin-top:28px;padding:12px 26px;border-radius:999px;border:1px solid rgba(235,203,126,.7);color:var(--gold-hi);text-decoration:none;font:600 15px var(--sans);letter-spacing:.02em}
.cv-open:hover{background:rgba(235,203,126,.1)}
.cv-season{position:absolute;left:0;right:0;bottom:26px;text-align:center;font:13px/1.6 var(--sans);color:rgba(239,230,210,.78);padding:0 48px}
.cv-season a{color:var(--gold-hi)}
.rib{position:absolute;top:0;left:23px;width:14px;height:calc(100% + 44px);z-index:3;pointer-events:none;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.35));transform-origin:50% 0}
.rib i{position:absolute;inset:0;display:block;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 15px),0 100%);
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 26%,rgba(255,255,255,.16) 52%,rgba(0,0,0,0) 72%,rgba(0,0,0,.24)),linear-gradient(var(--rb),var(--rb2))}
.rib.white i{background:linear-gradient(90deg,var(--gold) 0 2px,transparent 2px calc(100% - 2px),var(--gold) calc(100% - 2px)),linear-gradient(90deg,rgba(0,0,0,.12),rgba(0,0,0,0) 26%,rgba(255,255,255,.4) 52%,rgba(0,0,0,0) 72%,rgba(0,0,0,.14)),#F3EDE0}
.rib.anim{animation:ribdrop 1.5s cubic-bezier(.22,.9,.25,1) .15s both,ribsway 2.6s ease-in-out 1.55s both}
@media (min-width:761px){.rib{left:max(14%,60px);width:20px}}
@keyframes ribdrop{from{transform:translateY(-104%)}to{transform:none}}
@keyframes ribsway{0%{transform:rotate(0)}30%{transform:rotate(1.4deg)}62%{transform:rotate(-.7deg)}100%{transform:rotate(0)}}

/* 종이 장 */
.band{padding-top:30px}
.leaf{background:var(--leaf);border-radius:6px;box-shadow:0 1px 0 var(--rule),0 18px 40px -30px var(--shadow)}
.leaf-in{padding:22px 20px}
@media (min-width:761px){.leaf-in{padding:30px 34px}}
.h2{font:700 25px/1.35 var(--serif);margin:0 0 4px}
.lede{margin:0;color:var(--ink2);font:15px/1.7 var(--sans)}
.rub{font:700 15px/1.4 var(--serif);color:var(--verm);margin:22px 0 6px}

/* 이어 보기 · 오늘의 카드 · 절기 */
.duo{display:grid;gap:14px}
@media (min-width:761px){.duo{grid-template-columns:1.25fr 1fr}}
.today{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;text-decoration:none;color:inherit;padding:14px}
.today .kc{width:118px}
.today .kick{font:600 13px var(--sans);color:var(--verm);margin:0}
.today h3{font:700 21px/1.35 var(--serif);margin:4px 0 6px}
.today p{margin:0;font:16px/1.7 var(--serif);color:var(--ink2)}
.season{padding:18px 20px;display:grid;align-content:center;gap:8px}
.season .sw{display:inline-block;width:10px;height:26px;vertical-align:-7px;margin-right:8px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);background:var(--rb)}
.season .sw.white{background:#F3EDE0;box-shadow:inset 0 0 0 1px var(--gold)}
.season h3{font:700 19px/1.4 var(--serif);margin:0}
.season p{margin:0;color:var(--ink2);font:14.5px/1.7 var(--sans)}
.season a.go{justify-self:start;font:600 14px var(--sans);color:var(--lapis2);text-decoration:none;border-bottom:1px solid currentColor}
:root[data-theme="dark"] .season a.go{color:var(--gold-hi)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .season a.go{color:var(--gold-hi)}}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit}
.resume img{width:44px;height:58px;object-fit:cover;border-radius:6px}
.resume b{display:block;font:700 16px var(--serif)}
.resume span{font:13px var(--sans);color:var(--ink2)}

/* 차례 */
.toc{list-style:none;margin:14px 0 0;padding:0}
.toc li+li{border-top:1px solid var(--rule)}
.toc a{display:grid;grid-template-columns:2.1em 1fr 64px;gap:2px 14px;align-items:center;padding:16px 0;text-decoration:none;color:inherit}
.toc .no{font:700 22px/1 var(--serif);color:var(--verm);align-self:start;padding-top:4px}
.toc .t{display:block;font:700 19.5px/1.35 var(--serif)}
.toc .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;font:14px/1.65 var(--sans);color:var(--ink2)}
@media (min-width:761px){.toc .d{-webkit-line-clamp:3}}
.toc .n{display:block;margin-top:6px;font:500 12.5px var(--sans);color:var(--ink3)}
.toc .n b{color:var(--ink);font-weight:600}
.toc .th{width:64px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:var(--pc);position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.toc .th img{width:100%;height:100%;object-fit:cover}
.toc .th::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--pc)}
.toc .th.plain{display:grid;place-items:center;color:rgba(255,255,255,.85);font:700 20px var(--serif)}
.toc.sets{margin-top:26px}
.toc.sets a{grid-template-columns:2.1em minmax(0,1fr)}
.toc a:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
@media (min-width:761px){.toc a{grid-template-columns:2.6em 1fr 76px;padding:18px 0}.toc .th{width:76px}}

.more-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--leaf);border-radius:999px;padding:8px 14px;font:500 14px var(--sans);text-decoration:none;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink3)}

/* 장 */
.plate{position:relative;background:var(--pc);color:#F7F1E6;overflow:hidden}
.plate-img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:var(--cv,50% 50%)}
.plate-body{padding:20px 0 26px}
.plate .back{display:inline-block;font:500 13.5px var(--sans);color:rgba(247,241,230,.85);text-decoration:none;margin-bottom:12px}
.plate .back:hover{color:#fff}
.plate .no{font:600 14px var(--sans);color:rgba(247,241,230,.86)}
.plate h1{font:700 clamp(30px,7.5vw,48px)/1.22 var(--serif);margin:4px 0 12px}
.plate p{margin:0;max-width:31em;font:16.5px/1.8 var(--serif);color:rgba(247,241,230,.94)}
.plate .meta{margin-top:14px;font:13px var(--sans);color:rgba(247,241,230,.78)}
.plate.noimg .plate-body{padding-top:44px;padding-bottom:40px}
.plate.noimg .big{position:absolute;right:-.06em;bottom:-.28em;font:700 clamp(160px,42vw,340px)/1 var(--serif);color:rgba(255,255,255,.08);pointer-events:none}
@media (min-width:900px){
  .plate{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:420px}
  .plate-img{position:absolute;inset:0 0 0 50%;width:50%;height:100%;aspect-ratio:auto}
  .plate-img-shade{position:absolute;inset:0 0 0 50%;background:linear-gradient(90deg,var(--pc),transparent 34%)}
  .plate .wrap{grid-column:1/-1;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .plate-body{padding:46px 40px 44px 0;align-self:center}
}
.setnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh));z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.setnav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:9px;padding-bottom:9px;scrollbar-width:none}
.setnav .wrap::-webkit-scrollbar{display:none}
.setnav button{flex:0 0 auto;border:1px solid var(--rule);background:var(--leaf);border-radius:999px;padding:6px 12px;font:500 13px var(--sans);cursor:pointer;color:var(--ink2);white-space:nowrap}
.setnav button:hover{color:var(--ink);border-color:var(--ink3)}
.set{padding-top:32px;scroll-margin-top:calc(var(--barh) + 64px)}
.set-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.set-k{font:600 13px var(--sans);color:var(--pck)}
.set h2{font:700 21px/1.4 var(--serif);margin:2px 0 4px}
.set-n{flex:none;margin:0 0 7px;font:500 12.5px/1 var(--sans);color:var(--ink3);white-space:nowrap}
.set-n b{font:700 21px/1 var(--serif);color:var(--ink);margin-right:3px}
.set-n.done b{color:var(--gold)}
.set-sub{margin:0 0 14px;max-width:46em;font:14px/1.7 var(--sans);color:var(--ink2)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:min(64vw,264px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 18px;scroll-padding-left:max(16px,env(safe-area-inset-left,0px));scrollbar-width:thin}
@media (min-width:761px){.shelf{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:22px 18px;overflow:visible;margin:0;padding:4px 0 8px}}

/* 카드: 깊이 읽기 카드와 같은 다섯 단계 테두리(양피지 → 먹 글씨 → 붉은 머리글자 → 금박 → 채색) */
.kci{display:block;min-width:0;text-decoration:none;color:inherit;scroll-snap-align:start}
.kci .kc{width:100%}
.kci-q{display:block;margin:12px 2px 0;font:15px/1.65 var(--serif);color:var(--ink2)}
.kci:hover .kci-q{color:var(--ink)}
.kci:focus-visible{outline:none}
.kci:focus-visible .kc{outline:2px solid var(--verm);outline-offset:4px}
.kc{--mat:0px;--rad:14px;position:relative;display:block;aspect-ratio:3/4;border-radius:var(--rad);text-decoration:none;color:#F5EEDF;min-width:0;
  background:#1C1612;box-shadow:0 18px 30px -22px var(--shadow),0 2px 5px -3px var(--shadow)}
.kc-in{position:absolute;z-index:1;inset:var(--mat);border-radius:calc(var(--rad) - var(--mat) * .55);overflow:hidden;background:#2A211A}
.kc-in img{width:100%;height:100%;object-fit:cover}
.kc-cap{position:absolute;left:0;right:0;bottom:0;display:grid;gap:2px;padding:52px 13px 14px;background:linear-gradient(180deg,rgba(15,11,8,0),rgba(15,11,8,.72) 46%,rgba(15,11,8,.9))}
.kc.typ .kc-cap{padding-top:30px;background:linear-gradient(180deg,rgba(15,11,8,0),rgba(15,11,8,.55) 40%,rgba(15,11,8,.78))}
.kc-k{font:500 12px/1.45 var(--sans);color:rgba(245,238,223,.8)}
.kc-t{font:700 19px/1.3 var(--serif);color:#FBF6EA}
.kc-no{position:absolute;z-index:3;top:calc(var(--mat) + 8px);left:calc(var(--mat) + 8px);padding:5px 8px;border-radius:999px;font:600 11px/1 var(--sans);letter-spacing:.02em;background:rgba(16,12,8,.6);color:#F1E8D6;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.kc.lv1,.kc.lv2,.kc.lv3{--mat:7px;background:radial-gradient(120% 90% at 28% 12%,#F7EED8 0%,#E9D8B1 55%,#D4BB8A 100%);box-shadow:inset 0 0 0 1px rgba(120,90,40,.35),0 18px 30px -22px var(--shadow),0 2px 5px -3px var(--shadow)}
.kc.lv2::before,.kc.lv3::before,.kc.lv4::before,.kc.lv5::before{content:"";position:absolute;z-index:1;inset:2px;border:1.5px solid #2B2118;border-radius:calc(var(--rad) - 2px);pointer-events:none}
.kc.lv2::after,.kc.lv3::after,.kc.lv4::after,.kc.lv5::after{content:"";position:absolute;z-index:1;inset:4.5px;border:1px solid #2B2118;border-radius:calc(var(--rad) - 4.5px);pointer-events:none}
.kc .dc{display:inline-block}

.gfx.on{background:rgba(12,9,6,.9);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.gfx-in{display:grid;justify-items:center;gap:8px;text-align:center;color:#F4ECDD;max-width:360px}
.gfx-card{position:relative;width:min(54vw,220px);opacity:0}
.gfx-card .kc{width:100%}
.gfx .kc.gfx-k{--mat:0px;transition:--mat .8s cubic-bezier(.2,.8,.2,1) .55s}
.gfx.on .kc.gfx-k{--mat:7px}
.gfx-card .corners{--cs:22px;opacity:0}
.gfx.on .gfx-card{animation:gfxIn .5s cubic-bezier(.2,.9,.25,1) .05s both,gfxSettle .7s ease 1.35s both}
.gfx.on .gfx-card .corners{animation:corner .45s ease-out 1.45s both}
.gfx.on .gfx-card::after{content:"";position:absolute;inset:0;z-index:5;border-radius:14px;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(110deg,transparent 36%,rgba(255,242,205,.85) 50%,transparent 64%) 100% 0/250% 100% no-repeat;animation:glint 1.1s ease-in-out 1.7s both}
.gfx-t{margin:18px 0 0;font:700 23px/1.4 var(--serif);opacity:0}
.gfx-s{margin:0;font:15px/1.7 var(--sans);color:rgba(244,236,221,.84);opacity:0}
.gfx-s b{color:#F0D693;font-weight:600}
.gfx-b{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px;opacity:0}
.gfx-b .btn.ghost{color:#F4ECDD;box-shadow:inset 0 0 0 1px rgba(244,236,221,.4)}
.gfx.on .gfx-t,.gfx.on .gfx-s,.gfx.on .gfx-b{animation:fadeUp .5s ease 1.15s both}
@keyframes gfxIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
@keyframes gfxSettle{0%{opacity:1;transform:none}45%{opacity:1;transform:translateY(5px) rotate(-1.4deg) scale(.98)}100%{opacity:1;transform:rotate(-2.2deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 손에 든 카드: 손이 닿을 때만 살짝 기울고 빛이 따라와요. 종이는 은은하게, 금박부터 반짝, 채색은 안료빛까지 */
.held{--rx:0deg;--ry:0deg;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .55s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.held.notilt{transform:none}
.held.live{transition:transform .08s linear}
.glare,.lamp,.iris{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .45s}
.glare,.iris{z-index:0}
.lamp{z-index:2;background:radial-gradient(farthest-corner circle at var(--lx,50%) var(--ly,30%),rgba(255,250,235,.3),rgba(255,250,235,0) 55%);mix-blend-mode:soft-light}
.glare{background:radial-gradient(farthest-corner circle at var(--lx,50%) var(--ly,30%),rgba(255,250,235,.55),rgba(255,250,235,0) 50%);mix-blend-mode:soft-light}
.held.on .glare,.held.on .lamp{opacity:1}
.kc.lv4 .glare,.kc.lv5 .glare,.cback .glare{background:radial-gradient(farthest-corner circle at var(--lx,30%) var(--ly,22%),rgba(255,246,214,.98) 0%,rgba(255,226,150,.5) 16%,rgba(255,226,150,0) 44%);mix-blend-mode:overlay}
.cback .glare{z-index:5}
.iris{background:linear-gradient(115deg,rgba(255,90,140,0) 14%,rgba(255,90,140,.26) 30%,rgba(255,214,90,.26) 42%,rgba(90,230,210,.26) 54%,rgba(120,130,255,.26) 66%,rgba(255,90,140,0) 82%);background-size:240% 240%;background-position:var(--lx,30%) var(--ly,22%);mix-blend-mode:color-dodge}
.held.on .kc.lv5 .iris{opacity:.85}
.held.still .kc.lv4 .glare,.held.still .kc.lv5 .glare{opacity:.5}
.held.still .kc.lv5 .iris{opacity:.35}

<script>

const dParts = s => { const m = /^(\d{4})\.(\d{2})\.(\d{2})$/.exec(String(s || '')); return m ? [+m[1], +m[2], +m[3]] : null; };

/* 직접 넣은 사진(img/my/list.txt): 적힌 카드는 그 사진과 출처가 먼저 나와요 */

/* 카드 단계: 이야기를 끝까지 보면 1(양피지). 깊이 읽기가 있는 카드는 그 페이지의 기록을 따라가요. */
function deepStage(id){ try { const v = JSON.parse(localStorage.getItem('deep2-' + id) || 'null'); if (!v || !v.ach) return 0; let s = 0; for (let n = 1; n <= 5; n++) { if (v.ach['s' + n]) s = n; else break; } return s; } catch (e) { return 0; } }

/* 교회력 리본(서방 교회 기준) */
function easter(y){ const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }

  let k, c;

  else if (t >= adv) { k = '대림절'; c = 'violet'; }

  else if (same(t, gf)) { k = '성금요일'; c = 'red'; }
  else if (t >= ash && t < E) { k = '사순절'; c = 'violet'; }
  else if (same(t, pent)) { k = '성령강림절'; c = 'red'; }

  const line = k === '대림절' ? '대림절이에요. 많은 교회가 보라색을, 어떤 교회는 파란색을 써요.'
    : k === '연중 시기' ? '지금은 ‘연중 시기’예요. 많은 교회가 이때 초록색을 써요.'
    : `${k}${ida(k)}. 많은 교회가 ${word}을 써요.`;
  let until = Math.round((adv - t) / 864e5);
  return {k, c, col: W[c], line, word, toAdvent: (k === '연중 시기' && until > 0 && until <= 40) ? until : 0, adv};
}

/* 데이터 */
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }
async function loadCh(id){
  if (!CHD[id]) {
    const d = await getJSON(`data/ch-${id}.json`);
    for (const [cid, m] of Object.entries(MY)) { const c = d.cards[cid]; if (c) Object.assign(c, {cr: m.cr, cru: m.u, alt: m.alt, qf: [m.cv[0], m.cv[1], 1]}); }
    CHD[id] = d;

  return CHD[id];
}
/* 줄마다: 파일 이름 | 사진 설명과 출처 | 사진이 있던 주소 | 가로 세로 위치(쓰지 않아도 돼요). '#'으로 시작하는 줄은 읽지 않아요. 파일이 실제로 있는 줄만 써요. */
async function loadMy(){
  try {
    const r = await fetch('img/my/list.txt', {cache: 'no-cache'}); if (!r.ok) return;
    const rows = (await r.text()).replace(/^﻿/, '').split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
    const want = [];
    for (const row of rows) {
      const [f0, cr = '', u = '', pos = ''] = row.split('|').map(s => s.trim());
      const file = /\.(jpe?g|png|webp|gif)$/i.test(f0) ? f0 : f0 + '.jpg', id = file.replace(/\.[^.]+$/, '');
      const c = IX.cards[id]; if (!c) continue;
      const p = pos.split(/[\s,]+/).map(Number), cv = p.length === 2 && p.every(n => n >= 0 && n <= 100) ? p : [50, 30];
      want.push({id, f: 'img/my/' + encodeURIComponent(file), cr: cr || '사진 출처를 아직 적지 않았어요', u: /^https?:\/\//.test(u) ? u : '', alt: (cr.split(' · ')[0] || c.t + ' 사진'), cv});
    }
    const ok = await Promise.all(want.map(w => fetch(w.f, {method: 'HEAD'}).then(r => r.ok, () => false)));
    want.forEach((w, i) => { if (!ok[i]) return; MY[w.id] = w; Object.assign(IX.cards[w.id], {typ: false, cv: w.cv}); });
  } catch (e) {}
}
const chOf = id => IX.chapters.find(c => c.id === id);
function chCount(ch){ let n = 0; for (const s of ch.sets) for (const id of IX.sets[s].cards) if (stageOf(id)) n++; return n; }
function totalGot(){ return Object.keys(IX.cards).filter(id => stageOf(id)).length; }
function pick(seed, arr){ let h = 2166136261; for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return arr[(h >>> 0) % arr.length]; }

/* 화면 그리기 */
const view = $('#view');
let cur = {v: null, a: null};
function setTabs(v){ const map = {home: 'home', toc: 'toc', ch: 'toc', all: 'all', album: 'album', find: 'find', stories: 'home', notes: 'home', pilgrim: 'home'}; $$('[data-tab]').forEach(a => { if (a.dataset.tab === map[v]) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
/* 카드 그리기: 선반 카드(card), 작은 카드(mini), 카드 책의 자리(place) */
const ORN1 = `<path d="M3 27V9a6 6 0 0 1 6-6h18" fill="none" stroke="#24418f" stroke-width="3.2"/><path d="M7 27V11a4 4 0 0 1 4-4h16" fill="none" stroke="#f3d27a" stroke-width="1.3"/><circle cx="8" cy="8" r="4.6" fill="#b8322a" stroke="#f3d27a" stroke-width="1.2"/><path d="M14 13c3-4 7-4 9-1-3 2-6 3-9 1z" fill="#2f7a4f"/>`;
const ORN4 = ['tl', 'tr', 'bl', 'br'].map(k => `<svg class="orn ${k}" viewBox="0 0 30 30" aria-hidden="true">${ORN1}</svg>`).join('');
const seal = t => `<svg class="kc-seal" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="1"/>${t ? `<text x="20" y="25.5" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" font-family="Gowun Batang, serif">${esc(t)}</text>` : ''}</svg>`;
const deco = (s, t) => (s >= 3 ? seal(t) : '') + (s >= 5 ? ORN4 : '');
const first = t => [...String(t)][0] || '';
function dcT(t, s){ if (s < 3) return esc(t); const a = [...String(t)]; return `<span class="dc">${esc(a[0])}</span>${esc(a.slice(1).join(''))}`; }
const cardImg = (id, c, lazy = true) => `<img${lazy ? ' loading="lazy"' : ''} decoding="async" src="${img(id)}" alt="" style="object-position:${c.cv[0]}% ${c.cv[1]}%">`;
function card(id){
  const c = IX.cards[id], s = stageOf(id), n = IX.sets[c.set].cards.length;
  return `<a class="kci" href="#c-${id}" data-kc="${id}"><span class="kc lv${s}${c.typ ? ' typ' : ''}"><span class="kc-in">${cardImg(id, c)}<span class="kc-cap">${c.typ ? '' : `<span class="kc-k">${esc(c.tag)}</span>`}<span class="kc-t">${dcT(c.t, s)}</span></span></span><span class="kc-no" aria-hidden="true">${c.no} / ${n}</span>${deco(s, first(c.t))}</span><span class="kci-q">${esc(P.kid ? c.kq : c.q)}</span></a>`;
}
function setCount(sid){ const s = IX.sets[sid], m = s.cards.length, n = s.cards.filter(id => stageOf(id)).length; return `<p class="set-n${n === m ? ' done' : ''}" data-sn="${sid}" aria-label="${m}장 가운데 ${n}장 모음"><b>${n}</b>/ ${m} 모음</p>`; }

const ORN = `<svg class="cv-orn" viewBox="0 0 260 20" aria-hidden="true"><path d="M0 10h108M152 10h108" stroke="currentColor" stroke-width="1"/><path d="M114 10h8M138 10h8" stroke="currentColor" stroke-width="1.4"/><path d="M130 2l8 8-8 8-8-8z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M130 6v8M126 10h8" stroke="currentColor" stroke-width="1.2"/></svg>`;

/* 손에 든 카드: 마우스나 손가락을 따라 기울고(최대 6도), 빛이 따라와요. 움직임 줄이기를 켜면 빛만 고정해서 보여요. */
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function hold(box, opt = {}){
  if (!box || box.dataset.held) return;

  if (opt.tilt === false) box.classList.add('notilt');
  $$('.kc, .cback', box).forEach(k => { if (!k.querySelector(':scope > .glare')) k.insertAdjacentHTML('beforeend', '<i class="glare" aria-hidden="true"></i><i class="lamp" aria-hidden="true"></i><i class="iris" aria-hidden="true"></i>'); });

  const paint = () => {

    if (opt.tilt !== false) { box.style.setProperty('--ry', ((x - .5) * 12).toFixed(2) + 'deg'); box.style.setProperty('--rx', ((.5 - y) * 10).toFixed(2) + 'deg'); }
    $$('.kc, .cback', box).forEach(k => { k.style.setProperty('--lx', (x * 100).toFixed(1) + '%'); k.style.setProperty('--ly', (y * 100).toFixed(1) + '%'); });
  };
  const go = e => { pt = {x: e.clientX, y: e.clientY}; box.classList.add('on', 'live'); if (!raf) raf = requestAnimationFrame(paint); };

  box.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(rest, 250); });

/* ---------- 오늘 펼친 쪽(첫 화면) ---------- */
const WD = ['일', '월', '화', '수', '목', '금', '토'], DAYMS = 864e5;
const dayNo = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / DAYMS);
function dayInfo(now){
  const s = season(now), t = new Date(now.getFullYear(), now.getMonth(), now.getDate()), y = t.getFullYear(), E = easter(y);
  const feasts = [[new Date(y, 11, 25), '성탄절'], [new Date(y, 0, 6), '주현절'], [E, '부활절'], [addD(E, -7), '종려주일'], [addD(E, -2), '성금요일'], [addD(E, -46), '재의 수요일'], [addD(E, 49), '성령강림절']];
  const f = feasts.find(([d]) => +d === +t);
  let line = '';
  if (s.k === '대림절') { const w = Math.floor((t - s.adv) / (7 * DAYMS)); line = `대림 ${['첫째', '둘째', '셋째', '넷째'][Math.max(0, Math.min(w, 3))]} 주`; }
  else if (s.toAdvent) line = `대림절까지 ${s.toAdvent}일`;
  return {s, t, red: t.getDay() === 0 || !!f, feast: f ? f[1] : '', line};
}
function todayStory(){
  const s = season(new Date());
  const all = IX.storyOrder.filter(id => { const c = IX.cards[IX.stories[id].card]; return c && !c.typ; });
  const chFor = (s.k === '대림절' || s.k === '성탄 시기') ? 'christmas' : (['사순절', '종려주일', '성금요일', '부활 시기'].includes(s.k) ? 'easter' : '');
  const sea = chFor ? all.filter(id => IX.cards[IX.stories[id].card].ch === chFor) : [];
  return pick('story-' + today(), sea.length && dayNo() % 2 === 0 ? sea : all);
}
/* 오늘의 카드: 아직 모으지 않은 카드 가운데 하루 한 장을 골라 두고, 그날 하루는 바꾸지 않아요. */
function todayPick(){
  const d = today(), sid = todayStory(), scid = IX.stories[sid].card;

function recordFile(){
  const deep = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^deep2-[a-z0-9-]+$/.test(k)) deep[k] = JSON.parse(localStorage.getItem(k)); } } catch (e) {}
  return {kind: 'card-book', v: 1, app: '처음 만나는 기독교 문화', saved: new Date().toISOString(), cards: Object.keys(P.got).length, book: {got: P.got, ord: P.ord, seen: P.seen}, deep};
}
const achN = o => o && o.ach ? Object.values(o.ach).filter(Boolean).length : 0;
function mergeRecord(r){
  let added = 0;
  for (const [id, d] of Object.entries(r.book.got || {})) {
    if (typeof d !== 'string' && d !== true) continue;
    const cur = P.got[id];
    if (!cur) { P.got[id] = d; added++; } else if (typeof d === 'string' && typeof cur === 'string' && d < cur) P.got[id] = d;
  }
  P.ord = [...new Set([...(Array.isArray(r.book.ord) ? r.book.ord : []), ...P.ord])].filter(id => typeof id === 'string');
  if (r.book.seen && typeof r.book.seen === 'object') for (const k of Object.keys(r.book.seen)) P.seen[k] = 1;
  for (const [k, v] of Object.entries(r.deep || {})) {
    if (!/^deep2-[a-z0-9-]+$/.test(k) || !v || typeof v !== 'object') continue;
    let cur = null; try { cur = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) {}
    if (achN(v) > achN(cur)) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  save(); return added;
}
function wireKeep(){

    const done = m => { P.bk = today(); P.bkN = Object.keys(P.got).length; save(); msg.textContent = m; const kl = $('.keep-last'); if (kl) kl.textContent = `${longDate(P.bk)}에 마지막으로 저장했어요. 그때 카드 ${P.bkN}장이었어요.`; };
    const down = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      done(`기록 파일을 저장했어요. 내려받은 파일(${name})을 잘 보관해 두세요.`);

    /* 휴대폰에서는 공유 창으로 보내요: ‘파일에 저장’이나 나에게 보내기로 간직할 수 있어요. */
    let f = null; try { f = new File([text], name, {type: 'application/json'}); } catch (e) {}
    if (f && matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({files: [f]})) {
      navigator.share({files: [f]}).then(() => done('기록 파일을 보냈어요. ‘파일에 저장’이나 나에게 보내기로 잘 간직해 두세요.'), e => { if (!e || e.name !== 'AbortError') down(); });
    } else down();
  };
  fi.onchange = () => {
    const f = fi.files && fi.files[0]; if (!f) return; ask.hidden = true;
    const rd = new FileReader();
    rd.onload = () => {

function makeDemo(){
  const st = {}, d = {}, ord = [], base = new Date();
  const add = (id, l) => { if (!st[id]) { st[id] = l; ord.push(id); } };
  IX.chapters.forEach((ch, ci) => ch.sets.forEach((sid, si) => {
    const cs = IX.sets[sid].cards;
    if (si === 0 && ci % 3 !== 2) cs.forEach(id => add(id, 1));
    else if (si === 1 && ci % 2 === 0) cs.slice(0, Math.ceil(cs.length / 2)).forEach(id => add(id, 1));
    else if (si === 2 && ci === 0) add(cs[0], 1);
  }));
  const lift = [2, 3, 4, 2, 5, 3, 2, 4, 3, 2];
  ord.filter((_, i) => i % 6 === 2).slice(0, lift.length).forEach((id, i) => { st[id] = lift[i]; });
  if (IX.cards['keep-sinai']) { delete st['keep-sinai']; const k = ord.indexOf('keep-sinai'); if (k >= 0) ord.splice(k, 1); add('keep-sinai', 5); }
  ord.forEach((id, i) => { d[id] = ymd(addD(base, -Math.round(40 * (1 - (i + 1) / ord.length)))); });
  const seen = {}; ord.forEach(id => { seen[id] = 1; }); delete seen[ord[ord.length - 1]];
  return {st, d, ord, seen};
}

function drawStory(st, c){
  if (!st) { leaveSheet(); return; }
  const pic = IX.cards[c.id] && !IX.cards[c.id].typ;
  panel.innerHTML = `${xBtn()}${pic ? `<figure class="sh-fig"><div class="sh-frame"><img src="${img(c.id)}" alt="${esc(c.alt)}"></div><figcaption class="sh-cap">${esc(c.cr)}${c.cru ? ` <a href="${esc(c.cru)}" target="_blank" rel="noopener">사진 정보</a>` : ''}</figcaption></figure>` : ''}<div class="sh-body"${pic ? '' : ' style="padding-top:60px"'}>
    <p class="crumbs"><a href="#stories">긴 이야기</a> <span aria-hidden="true">›</span> <a href="#c-${c.id}">‘${esc(c.t)}’ 카드</a></p>
    <h2 class="sh-t" id="shTitle">${esc(st.t)}</h2><p class="sh-by">${esc(st.k)}</p>
    <div class="prose" style="margin-top:18px"><p class="lead${/^[0-9]/.test(st.lead) ? '' : ' dcap'}">${esc(st.lead)}</p>${para(st.body)}
      ${st.after ? `<p class="rub">지금 그 자리</p>${para(st.after)}` : ''}
      ${st.unc ? `<p class="rub">확실하지 않은 것</p>${para(st.unc)}` : ''}</div>
    <div class="storybox" id="stBox">${storyBoxIn(c.id)}</div>
    ${cautions(st.c)}${srcList(st.src)}
  </div>`;
  const b = $('#sbGet'); if (b) b.onclick = () => { if (collect(c.id)) { const box = $('#stBox'); if (box) box.innerHTML = storyBoxIn(c.id); } };
}
/* 긴 이야기 끝: 이어진 카드를 바로 카드 책에 꽂을 수 있어요. */
function storyBoxIn(id){
  const c = IX.cards[id], d = shortDate(gotDate(id));
  return `<span class="sb-card">${mini(id)}</span><div class="sb-in">${stageOf(id)
    ? `<p>이 이야기의 카드 ‘${esc(c.t)}’${fin(c.t) ? '은' : '는'} ${d ? `${d}에 ` : ''}카드 책에 꽂았어요.</p><div class="acts"><a class="btn gold" href="#c-${id}">카드 펼치기</a><a class="btn ghost" href="#album">카드 책에서 보기</a></div>`
    : `<p>이 이야기가 마음에 남았다면 ‘${esc(c.t)}’${fin(c.t) ? '을' : '를'} 카드 책에 꽂아 두세요. 오늘 날짜와 함께 남아요.</p><div class="acts"><button class="btn gold" type="button" id="sbGet">카드 책에 꽂기</button><a class="btn ghost" href="#c-${id}">카드 펼치기</a></div>`}</div>`;
}
/* 카드를 카드 책에 꽂기(카드의 이야기 끝, 긴 이야기 끝 모두 여기로) */
function collect(id){
  if (stageOf(id)) return false;
  P.got[id] = today(); P.ord = P.ord.filter(x => x !== id).concat(id); save();
  keepSafe(); gotMoment(id); refreshTiles(id); refreshHome();
  return true;
}
/* 브라우저에 '이 기록은 지우지 말아 주세요'라고 조용히 부탁해요(물어보는 창이 뜨는 파이어폭스는 빼요). */
function keepSafe(){
  try { if (navigator.storage && navigator.storage.persist && !/Firefox\//.test(navigator.userAgent)) navigator.storage.persisted().then(v => v || navigator.storage.persist()).catch(() => {}); } catch (e) {}
}
function refreshHome(){
  if (!$('#front')) return;
  paintToday(todayPick().tid);
  const as = $('.astrip'); if (as) as.outerHTML = albumStrip(totalGot(), Object.keys(IX.cards).length);
  $$('.ctiles', view).forEach(el => { el.innerHTML = IX.chapters.map(chTile).join(''); });
}
function gotMoment(id){
  const c = IX.cards[id], s = IX.sets[c.set], ch = chOf(c.ch), el = $('#gfx');
  const done = s.cards.every(x => stageOf(x));
  el.innerHTML = `<div class="gfx-in" role="dialog" aria-modal="true" aria-labelledby="gfxT">
    <div class="gfx-card">${mini(id, 'mid').replace('class="kc ', 'class="kc gfx-k ')}<i class="corners" aria-hidden="true"></i></div>
    <p class="gfx-t" id="gfxT">카드 책에 꽂았어요</p>
    <p class="gfx-s">‘${esc(c.t)}’${fin(c.t) ? '이' : '가'} 양피지 카드가 되어 ${ch.no}장 ‘${esc(ch.t)}’ 자리에 들어갔어요.${done ? `<br><b>‘${esc(s.t)}’ ${NUMW[s.cards.length] || s.cards.length} 장을 모두 모았어요.</b>` : ''}</p>
    <div class="gfx-b"><a class="btn gold" href="#album" id="gfxGo">카드 책에서 보기</a><button class="btn ghost" type="button" id="gfxX">계속 읽기</button></div>
  </div>`;
  el.hidden = false; void el.offsetWidth; el.classList.add('on');
  $('#gfxX').onclick = closeMoment; $('#gfxGo').onclick = () => closeMoment();
  el.onclick = e => { if (e.target === el) closeMoment(); };
  setTimeout(() => { const b = $('#gfxGo'); if (b) b.focus({preventScroll: true}); }, 60);
}
function closeMoment(){ const el = $('#gfx'); el.classList.remove('on'); el.hidden = true; el.innerHTML = ''; }
function gotLine(id){ const d = shortDate(gotDate(id)); return `${d ? `${d}에 ` : ''}카드 책에 꽂았어요. 지금은 ${STAGES[stageOf(id)]} 단계예요. <a href="#album">카드 책에서 보기</a>`; }
function refreshTiles(id){
  $$(`[data-today="${id}"] .kc`).forEach(a => { a.outerHTML = mini(id); });
  $$(`.kci[data-kc="${id}"]`).forEach(a => { a.outerHTML = card(id); });
  const sid = IX.cards[id].set, el = document.querySelector(`[data-sn="${sid}"]`); if (el) el.outerHTML = setCount(sid);
}
let tT = 0;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2600); }

/* 길 찾기(주소의 #이름) */
function parse(){
  const h = decodeURIComponent(location.hash.slice(1)); let m;
  if (!h || h === 'home') return {v: 'home'};
  if ((m = h.match(/^ch-([a-z0-9-]+)$/))) return {v: 'ch', a: m[1]};
  if ((m = h.match(/^c-([a-z0-9-]+)$/))) return {v: 'card', a: m[1]};
  if ((m = h.match(/^i-([a-z0-9-]+)$/))) return {v: 'item', a: m[1]};
  if ((m = h.match(/^s-([a-z0-9-]+)$/))) return {v: 'story', a: m[1]};
  if (['album', 'find', 'stories', 'notes', 'toc', 'all', 'pilgrim'].includes(h)) return {v: h};
  return {v: 'home'};
}
const TITLES = {home: '', toc: '차례', all: '모두 둘러보기', album: '내 카드 책', find: '찾기', stories: '마음을 움직이는 이야기', notes: '만든 이의 노트', pilgrim: '천로역정 특집'};
function show(v, a, opt = {}){
  const same = cur.v === v && cur.a === a;
  if (!same) {
    cur = {v, a};
    if (v === 'ch') renderChapter(a); else if (v === 'album') renderAlbum(); else if (v === 'find') renderFind(); else if (v === 'stories') renderStories(); else if (v === 'notes') renderNotes(); else if (v === 'toc') renderToc(); else if (v === 'all') renderAll(); else if (v === 'pilgrim') renderPilgrim(); else renderHome();
    if (v !== 'home') { document.body.classList.remove('on-cover'); if (coverObs) coverObs.disconnect(); }
    window.scrollTo(0, 0);
  }
  base = v === 'ch' ? '#ch-' + a : '#' + v;
  setTabs(v);
  const ch = v === 'ch' ? chOf(a) : null;
  document.title = ch ? `${ch.no}장 ${ch.t} · 처음 만나는 기독교 문화` : (TITLES[v] ? `${TITLES[v]} · 처음 만나는 기독교 문화` : '처음 만나는 기독교 문화');
  $('#brand').textContent = ch ? `${ch.no}장 ${ch.t}` : (TITLES[v] || '처음 만나는 기독교 문화');
}
async function route(){
  const r = parse();
  if (r.v === 'card' || r.v === 'item' || r.v === 'story') {
    if (!cur.v) {
      const cid = r.v === 'card' ? r.a : r.v === 'item' ? (IX.items[r.a] || {}).card : (IX.stories[r.a] || {}).card;
      const st = IX.cards[cid]; show(st ? 'ch' : 'home', st ? st.ch : null);
    }
    await openSheet(r); return;
  }
  closeSheet();
  show(r.v, r.a, r);
}
$('#kid').onclick = () => {
  P.kid = !P.kid; save(); $('#kid').setAttribute('aria-pressed', String(P.kid));
  const keep = cur; cur = {v: null, a: null}; show(keep.v || 'home', keep.a); if (!sheet.hidden) route();
  toast(P.kid ? '아이와 함께 보기: 쉬운 말과 아이에게 건넬 질문으로 바뀌어요' : '어른 보기로 돌아왔어요');
};
window.addEventListener('hashchange', route);
(async () => {
  $('#kid').setAttribute('aria-pressed', String(!!P.kid));
  try { IX = await getJSON('data/index.json'); }
  catch (e) { view.innerHTML = `<div class="wrap band"><div class="leaf leaf-in"><h1 class="h2">책을 펼치지 못했어요</h1><p class="lede">데이터를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p></div></div>`; return; }
  await Promise.race([loadMy(), new Promise(r => setTimeout(r, 2500))]);
  if (PREVIEW && ssGet('demo')) { DEMO = makeDemo(); demoPill(); }
  await route();
})();
</script>
